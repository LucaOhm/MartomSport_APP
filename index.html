<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>MARTOM App – MVP Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* ===== Brand tokens (derived from martomsport.com) ===== */
:root{
  --bg:#FFFFFF; --surface:#F0F2F5; --surface2:#F9FAFB; --text:#0B0D10; --muted:#5B6370; --muted2:#7B7B7B;
  --line:#E3E7ED; --primary:#0566E0; --primary2:#2E7BFF; --star:#FDCC0D; --ok:#108474; --warn:#E59A00; --bad:#D7263D;
  --dark:#0B0D10; --dark2:#2A2D33; --r:16px; --prop:#C9CED6;
  --font:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--text);background:#E6E9EE;display:flex;justify-content:center;align-items:center;gap:56px;min-height:100vh;padding:24px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:14px;height:14px}

/* ===== Desktop pitch panel ===== */
.panel{width:400px;max-width:100%}
.pn-brand{font-weight:900;letter-spacing:.18em;font-size:22px}
.pn-brand small{display:inline-block;margin-left:10px;letter-spacing:0;font-weight:600;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 10px;vertical-align:middle}
.panel h1{font-size:30px;line-height:1.12;margin:22px 0 10px;font-weight:800}
.panel p.lead{color:var(--muted);margin:0 0 20px;line-height:1.5}
.pn-actions{display:flex;gap:10px;align-items:center;margin-bottom:22px}
.cycle{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.cycle span{font-size:12px;font-weight:600;background:#fff;border:1px solid var(--line);padding:5px 10px;border-radius:99px}
.cycle span.b{background:var(--dark);color:#fff;border-color:var(--dark)}
.pillars{display:grid;gap:10px}
.pillar{background:#fff;border-radius:14px;padding:14px 16px;display:flex;gap:12px}
.pillar b{display:block;font-size:14px;margin-bottom:2px}
.pillar span{font-size:13px;color:var(--muted);line-height:1.4}
.pillar .ic{width:34px;height:34px;border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--primary);flex:none}
.pn-note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}

/* ===== Phone frame ===== */
.phone{width:390px;height:min(844px,calc(100vh - 48px));min-height:640px;background:var(--bg);border-radius:48px;border:11px solid var(--dark);position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(11,13,16,.25);flex:none}
.scroll{position:absolute;inset:0 0 calc(68px + env(safe-area-inset-bottom)) 0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar,.lscroll::-webkit-scrollbar{display:none}
@media (max-width:899px){
  body{display:block;padding:0;background:var(--bg)}
  .panel{display:none}
  .phone{width:100%;height:100vh;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}
}

/* ===== App chrome ===== */
.ah{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 18px) 18px 10px;position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);z-index:5}
.wm{font-weight:900;letter-spacing:.2em;font-size:17px}
.wm sup{font-size:10px;letter-spacing:0;color:var(--primary);margin-left:2px}
.ah-r{display:flex;gap:6px;align-items:center}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);position:relative;flex:none}
.ibtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.lang{display:flex;background:var(--surface);border-radius:99px;padding:3px;font-size:12px;font-weight:700}
.lang button{padding:6px 9px;border-radius:99px;color:var(--muted)}
.lang button.on{background:var(--dark);color:#fff}
.pad{padding:4px 18px 28px}
.h1{font-size:28px;font-weight:800;margin:6px 0 14px;letter-spacing:-.01em}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px;gap:8px}
.sec h3{margin:0;font-size:17px;font-weight:800}
.sec button{font-size:13px;color:var(--primary);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.card.w{background:#fff;border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px;background:var(--surface);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff}
.btn.dark{background:var(--dark);color:#fff}
.btn.line{background:#fff;border:1px solid var(--line)}
.btn.gold{background:var(--star);color:var(--dark)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--surface);font-size:13px;font-weight:600}
.chip.on{background:var(--dark);color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.pill.ok{background:#E3F3F0;color:var(--ok)}.pill.warn{background:#FFF3D6;color:#9A6700}.pill.bad{background:#FCE4E7;color:var(--bad)}.pill.blue{background:#E4EEFC;color:var(--primary)}
.pill.plus{background:var(--dark);color:var(--star)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.bar.ok i{background:var(--ok)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.thumb{width:72px;height:72px;border-radius:12px;background:var(--surface);flex:none;overflow:hidden;position:relative}
.thumb img,.hero img{width:100%;height:100%;object-fit:cover;display:block}
.pimg{background:#F3F4F6}
.pimg img{object-fit:contain!important;mix-blend-mode:multiply;padding:6%}
img.noimg{visibility:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li b{display:block;font-size:15px}
.li .muted{font-size:13px}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 2px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:800}
.stat span{font-size:11px;color:var(--muted)}
.note{background:#E4EEFC;color:#033E8C;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.lock{position:absolute;inset:0;background:rgba(11,13,16,.55);display:grid;place-items:center;color:var(--star)}
.strike{text-decoration:line-through;color:var(--muted2);font-weight:500}

/* Tabbar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(68px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted2)}
.tabbar button.on{color:var(--text)}
.tabbar button.on svg{stroke:var(--primary)}

/* Home */
.hello h2{margin:0;font-size:26px;font-weight:800}
.hello p{margin:0 0 2px}
.lvlchip{display:inline-flex;align-items:center;gap:6px;background:var(--dark);color:#fff;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;margin-bottom:4px}
.lvlchip.plus{color:var(--star)}
.blk{margin-top:18px}
.blk-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.blk-h b{color:var(--text);letter-spacing:0;text-transform:none;font-size:13px}
.hero-card{position:relative;border-radius:20px;overflow:hidden;height:210px;background:var(--dark);color:#fff;display:block;width:100%;text-align:left}
.hero-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.8}
.hero-card .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,16,0) 25%,rgba(11,13,16,.9));padding:16px;display:flex;flex-direction:column;justify-content:flex-end}
.hero-card h4{margin:6px 0 4px;font-size:22px;font-weight:800}
.hero-card .meta{font-size:13px;opacity:.85}
.hero-card .go{position:absolute;right:14px;bottom:14px;width:50px;height:50px;border-radius:50%;background:var(--primary);display:grid;place-items:center}
.hero-card .go svg{fill:#fff;stroke:#fff}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:600;text-transform:capitalize}
.wd .c{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--line);font-size:13px;font-weight:800;color:var(--text)}
.wd.done .c{background:var(--ok);border-color:var(--ok);color:#fff}
.wd.missed .c{border-color:#F3B6BF;color:var(--bad)}
.wd.today .c{border-color:var(--primary);color:var(--primary)}
.wd.next .c{border-style:dashed;border-color:#B8C0CC}
.wd.rest .c{background:transparent;border-color:transparent;color:var(--muted2);font-weight:600}
.wd.td .l{color:var(--primary);font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border-radius:14px;padding:14px 8px;text-align:center}
.tile b{display:block;font-size:22px;font-weight:800}
.tile span{font-size:11.5px;color:var(--muted)}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hs::-webkit-scrollbar{display:none}
.reco{width:232px;flex:none;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);text-align:left;scroll-snap-align:start;display:flex;flex-direction:column}
.reco .im{height:100px;position:relative;background:var(--surface)}
.reco .im img{width:100%;height:100%;object-fit:cover}
.reco .im>.pill{position:absolute;left:8px;top:8px}
.reco .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.reco b{font-size:14.5px}
.reco .why{font-size:12.5px;color:var(--muted);line-height:1.35}
.reco .why b{font-size:12.5px;color:var(--text)}
.reco.locked .bd{filter:blur(3px);opacity:.6}
.steps-card .li{padding:9px 0}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:#fff}

/* Planner */
.prog-card{background:var(--dark);color:#fff;border-radius:var(--r);padding:16px}
.prog-card .k{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--star);font-weight:800;margin-bottom:4px}
.prog-card b{display:block;font-size:18px;margin-bottom:2px}
.dayrow{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;border:1px solid var(--line);margin-bottom:8px;background:#fff}
.dayrow.istoday{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.dayrow.rest{background:var(--surface2)}
.dayrow .dl{width:38px;text-align:center;flex:none}
.dayrow .dl span{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700}
.dayrow .dl b{font-size:18px}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.quota{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.plan{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--r);background:#fff;border:1px solid var(--line);margin-bottom:10px;width:100%;text-align:left}
.plan b{display:block;font-size:15px;margin:3px 0}
.plan .muted{font-size:12.5px}

/* Layers (overlays) */
.layer{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;animation:up .25s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.lscroll{flex:1;overflow-y:auto;scrollbar-width:none}
.lhead{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:14px;right:14px;display:flex;justify-content:space-between;z-index:3}
.lhead .ibtn{background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.hero{height:250px;background:var(--surface);position:relative;overflow:hidden}
.hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.6))}
.hero .t{position:absolute;left:18px;right:18px;bottom:16px;color:#fff}
.hero .t h2{margin:4px 0 0;font-size:26px;font-weight:800}
.hero.pimg .ov{background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(11,13,16,.55))}
.foot{padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line);display:flex;gap:10px;background:#fff}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:#fff}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
details{background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px}
details summary{font-weight:700;cursor:pointer;list-style:none;font-size:14.5px}
details summary::-webkit-details-marker{display:none}
details p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.demo{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--surface);margin-bottom:10px;width:100%;text-align:left}
.demo .fbox{width:96px;height:80px;border-radius:10px;background:#fff;flex:none}
.demo .pb{width:40px;height:40px;border-radius:50%;background:var(--dark);display:grid;place-items:center;flex:none}
.demo .pb svg{fill:#fff;stroke:#fff;margin-left:2px}
.fw{background:var(--dark);color:#fff;border-radius:var(--r);padding:16px}
.fw ul{margin:8px 0 12px;padding-left:18px;color:#C9CED6;font-size:13.5px;line-height:1.5}
.up{display:flex;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);margin-bottom:10px;background:#fff;align-items:center}
.up .why{font-size:12.5px;color:var(--muted);line-height:1.35;margin:2px 0 8px}

/* Exercise figure animation */
svg.fig{width:100%;height:100%;display:block;color:var(--text)}
svg.fig .pr{stroke:var(--prop)}
svg.fig .prf{fill:var(--prop)}
svg.fig .cab{stroke:var(--primary2)}
svg.fig .db{fill:var(--primary)}
.dk{--prop:#4A505A}
.dk svg.fig{color:#fff}

/* Player */
.ly-player{background:var(--dark);color:#fff}
.pl{display:flex;flex-direction:column;height:100%;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 16px);gap:10px}
.pl .ibtn{background:var(--dark2);color:#fff}
.pl-segs{display:flex;gap:3px}
.pl-segs i{height:4px;border-radius:2px;background:var(--dark2)}
.pl-segs i.done{background:#5D6470}.pl-segs i.cur{background:var(--primary2)}
.pl-main{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center}
.pl-anim{height:112px;background:var(--dark2);border-radius:14px;padding:4px}
.pl-tc .n{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#9AA3AF;font-weight:700}
.pl-tc .tg{font-size:17px;font-weight:800;margin:3px 0 6px;line-height:1.2}
.pl-time{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.pl-next{color:#9AA3AF;font-size:13px}
.pl-m{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pl-m div{background:var(--dark2);border-radius:12px;padding:9px 4px;text-align:center}
.pl-m b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.pl-m span{font-size:10.5px;color:#9AA3AF;text-transform:uppercase;letter-spacing:.06em}
.board{background:var(--dark2);border-radius:14px;padding:10px 12px;flex:1;min-height:0;overflow:hidden}
.board h5{margin:0 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9AA3AF;display:flex;justify-content:space-between}
.board .r{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14px}
.board .r.me{color:var(--star);font-weight:800}
.board .r .av{width:24px;height:24px;font-size:10px}
.pl-ctrl{display:flex;justify-content:space-between;align-items:center;padding:0 10px}
.pl-ctrl .big{width:68px;height:68px;border-radius:50%;background:var(--primary);display:grid;place-items:center}
.pl-ctrl .big svg{width:28px;height:28px;fill:#fff;stroke:#fff}
.pl-ctrl .sm{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#9AA3AF;width:64px}
.pl-ctrl .sm span.c{width:46px;height:46px;border-radius:50%;background:var(--dark2);display:grid;place-items:center;color:#fff}
.speed{font-size:12px;font-weight:700;background:var(--dark2);border-radius:99px;padding:8px 12px;color:var(--star)}

/* Summary */
.sum{padding:calc(env(safe-area-inset-top) + 40px) 22px 24px;text-align:center}
.sum .big{width:84px;height:84px;border-radius:50%;background:#E3F3F0;color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}
.sum .big svg{width:42px;height:42px;stroke-width:3}
.sum h2{margin:0 0 4px;font-size:26px;font-weight:800}
.stars{display:flex;justify-content:center;gap:6px;margin:8px 0}
.stars button{font-size:30px;color:var(--line)}
.stars button.on{color:var(--star)}
.newb{display:flex;gap:10px;align-items:center;background:#FFF8E6;border-radius:12px;padding:10px 12px;text-align:left;margin-top:8px}
.newb .e{font-size:26px}

/* Community */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin:6px 0 14px;text-align:center}
.podium div{background:var(--surface);border-radius:14px 14px 6px 6px;padding:10px 4px}
.podium .p1{padding-top:20px;background:#FFF5CC}
.podium .av{margin:0 auto 6px;width:42px;height:42px}
.podium b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podium span{font-size:12px;color:var(--muted)}
.lb .li.me{background:#E4EEFC;border-radius:12px;padding:12px 10px;margin:0 -10px;border:0}
.rank{width:22px;font-weight:800;color:var(--muted);text-align:center}
.post{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.post p{margin:10px 0;line-height:1.45;font-size:14.5px}
.wbox{background:var(--surface);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:center}
.pact{display:flex;gap:18px;margin-top:10px;font-size:13px;font-weight:600;color:var(--muted)}
.pact button{display:flex;gap:6px;align-items:center}
.pact button.on{color:var(--bad)}
.pact button.on svg{fill:var(--bad)}
.cmts{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13.5px}
.cmts div{padding:4px 0}
.in{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;outline:none}
.in:focus{border-color:var(--primary)}

function figSVG(k) {
  if (!POSES[k]) k = 'reach';
  const P = POSES[k], g = P.g || 90;
  return `<svg class="fig" data-k="${k}" viewBox="0 0 120 100" aria-hidden="true">
    <line x1="4" y1="${g}" x2="116" y2="${g}" class="pr" stroke-width="2"/>
    ${P.prop === 'mat' ? `<rect x="8" y="${g - 2}" width="104" height="3" rx="1.5" fill="var(--primary2)" opacity=".55"/>` : ''}
    ${PROPS[P.prop] || ''}
    ${P.anchor && !P.cw ? `<rect x="${P.anchor[0] - 3}" y="${P.anchor[1] - 7}" width="6" height="14" rx="2" class="prf"/>` : ''}
    ${P.anchor ? `<line class="cab" stroke-width="${P.cw || 1.6}" stroke-linecap="round"/>` : ''}
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <polyline class="lb" stroke-width="6" opacity=".38"/><polyline class="ab" stroke-width="5" opacity=".38"/>
      <line class="tr" stroke-width="8"/><polyline class="lf" stroke-width="6"/><polyline class="af" stroke-width="5"/></g>
    <circle class="hd" r="6.5" fill="currentColor"/>${P.db ? '<rect class="db" width="14" height="5" rx="2"/>' : ''}</svg>`;
}
function animFigs(ts) {
  document.querySelectorAll('svg.fig').forEach(svg => {
    const P = POSES[svg.dataset.k]; if (!P) return;
    const t = (1 - Math.cos(ts / 1000 / P.per * Math.PI * 2)) / 2;
    const A = P.A, B = P.B, J = {};
    for (const k in A) { const b = B[k] || A[k]; J[k] = [A[k][0] + (b[0] - A[k][0]) * t, A[k][1] + (b[1] - A[k][1]) * t]; }
    const pt = (...ks) => ks.map(k => J[k].join(',')).join(' ');
    const q = c => svg.querySelector('.' + c);
    q('lb').setAttribute('points', pt('p','kb','fb')); q('ab').setAttribute('points', pt('n','eb','hb'));
    q('lf').setAttribute('points', pt('p','kf','ff')); q('af').setAttribute('points', pt('n','ef','hf'));
    const tr = q('tr'); tr.setAttribute('x1', J.n[0]); tr.setAttribute('y1', J.n[1]); tr.setAttribute('x2', J.p[0]); tr.setAttribute('y2', J.p[1]);
    const hd = q('hd'); hd.setAttribute('cx', J.h[0]); hd.setAttribute('cy', J.h[1]);
    const cab = q('cab'); if (cab) { cab.setAttribute('x1', J.hf[0]); cab.setAttribute('y1', J.hf[1]); cab.setAttribute('x2', P.anchor[0]); cab.setAttribute('y2', P.anchor[1]); }
    const db = q('db'); if (db) { db.setAttribute('x', J.hf[0] - 7); db.setAttribute('y', J.hf[1] - 2.5); }
  });
  requestAnimationFrame(animFigs);
}

function careState(mid, idx) {

/* ---------- Weekly planner ---------- */
const todayDow = () => (new Date().getDay() + 6) % 7;

const prog = () => (S.prog === 'custom' && S.custom) ? S.custom : (PROGRAMS.find(p => p.id === S.prog) || PROGRAMS[0]);
function genPlan(w) {
  const pools = {run:['run5k','core','hill','walkwork','run5k'], strong:['benchup','mirrorfb','core','benchup','walkwork'], lose:['emotion','hill','core','walkwork','run5k'], fit:['run5k','benchup','core','walkwork','emotion']};
  let pool = pools[w.goal].map(fitPlan);
  if (w.care === 'knee') pool = pool.map(id => PLAN[id].kind === 'run' && id !== 'walkwork' ? fitPlan('emotion') : id);
  const sets = {3:[0,2,4], 4:[0,1,3,5], 5:[0,1,2,4,5]}[w.days];
  const td = todayDow(), shift = sets.includes(td) ? 0 : (td - sets[sets.length - 1] + 7) % 7;
  const days = {}; sets.map(d => (d + shift) % 7).sort((a, b) => a - b).forEach((d, i) => { days[d] = pool[i % pool.length]; });
  const g = WZ.goal.find(x => x[0] === w.goal);
  S.custom = {id:'custom', free:true, weeks:8, days, n:N('Personal plan · ' + g[1].en, 'Plan personal · ' + g[1].es), d:N('Made for you','Hecho para ti')};
  S.prog = 'custom'; S.progStart = weekStart(); S.sched = {}; S.goalType = w.goal; S.goal = +w.days; save();
}

function progWeek() { return Math.min(prog().weeks, Math.max(1, Math.floor((weekStart() - S.progStart) / (7 * D)) + 1)); }
function fitPlan(id) { const p = PLAN[id]; return owns(p) ? id : 'core'; }
function schedFor(d) {
  if (Object.prototype.hasOwnProperty.call(S.sched, d)) return S.sched[d];
  const id = prog().days[d]; return id ? fitPlan(id) : null;
}
function dayInfo(d) {
  const date = dayDate(d), k = dayKey(date.getTime()), td = todayDow();
  const ws = S.workouts.filter(w => dayKey(w.t) === k);
  const pid = schedFor(d);
  const st = ws.length ? 'done' : !pid ? 'rest' : d < td ? 'missed' : d === td ? 'today' : 'next';
  return { d, date, pid, ws, st, isToday: d === td };
}

const dayLong = date => date.toLocaleDateString(S.lang === 'es' ? 'es-CL' : 'en-US', {weekday:'long', day:'numeric', month:'short'});

  const gp = {lose:'emotion', strong:S.gear.includes('mirror') ? 'mirrorfb' : 'benchup', run:'run5k', fit:'mirrorfb'}[S.goalType];
  add({k:'plan', id:gp, why:tt(`Matches your goal <b>"${esc(goal)}"</b>.`, `Calza con tu objetivo <b>"${esc(goal)}"</b>.`)});

function chartSVG(seedStr, kind) {
  let s = 7; for (const ch of seedStr) s = (s * 31 + ch.charCodeAt(0)) % 9973;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  if (kind === 'strength') {
    const bars = Array.from({length:8}, () => 25 + rnd() * 60);
    return `<svg viewBox="0 0 160 70" preserveAspectRatio="none">${bars.map((h, i) => `<rect x="${8 + i * 19}" y="${66 - h * .7}" width="12" height="${h * .7}" rx="3" fill="var(--primary)" opacity="${.45 + i * .07}"/>`).join('')}</svg>`;
  }
  let y = 40; const pts = Array.from({length:24}, (_, i) => { y = Math.max(12, Math.min(60, y + (rnd() - .5) * 16)); return [i * (160 / 23), y]; });
  const line = pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
  return `<svg viewBox="0 0 160 70" preserveAspectRatio="none"><polygon points="0,70 ${line} 160,70" fill="rgba(5,102,224,.12)"/><polyline points="${line}" fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
}

function renderTour() {

function applyHL(scroll) {
  document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
  const sheet = $('#tourSheet');
  if (TS == null) { sheet.classList.remove('top'); return; }
  const s = TOUR[TS];
  const el = s.sel && document.querySelector(s.sel);
  if (el) { el.classList.add('hl'); if (scroll && el.id !== 'tabbar') el.scrollIntoView({behavior:'smooth', block:isDesk() ? 'center' : 'start'}); }
  if (!isDesk()) {
    const ref = (s.tap && document.querySelector(s.tap)) || el;
    setTimeout(() => { if (!ref) { sheet.classList.remove('top'); return; } const ph = $('#phone').getBoundingClientRect(), r = ref.getBoundingClientRect();
      sheet.classList.toggle('top', (r.top + Math.min(r.height, 120) / 2 - ph.top) > ph.height * 0.48); }, scroll ? 500 : 0);
  }
}
function tapAt(el) {
  if (!el) return;
  const ph = $('#phone').getBoundingClientRect(), r = el.getBoundingClientRect();
  const t = document.createElement('div'); t.className = 'tap';
  t.style.left = (r.left - ph.left + r.width / 2) + 'px'; t.style.top = (r.top - ph.top + r.height / 2) + 'px';
  $('#phone').appendChild(t); setTimeout(() => t.remove(), 950);
}
function placeHand() {
  let h = document.getElementById('hand');
  if (!h) { h = document.createElement('div'); h.id = 'hand'; $('#phone').appendChild(h); }
  const s = TS != null && TOUR[TS], el = s && s.tap && document.querySelector(s.tap);
  if (!el) { h.style.display = 'none'; return; }
  const ph = $('#phone').getBoundingClientRect(), r = el.getBoundingClientRect();
  if (r.width === 0 || r.bottom < ph.top || r.top > ph.bottom) { h.style.display = 'none'; return; }
  const left = r.left - ph.left + r.width / 2 - 12, top = Math.min(r.top - ph.top + r.height / 2 + 4, ph.height - 50);
  if (h.style.display !== 'block') h.innerHTML = `<span class="h">👆</span><span class="bub">${tt('Tap here','Toca aquí')}</span>`;
  h.style.display = 'block'; h.style.left = left + 'px'; h.style.top = top + 'px';
  h.querySelector('.bub').style.left = (left > ph.width - 140 ? -104 : 30) + 'px';
}
function confetti() {
  const ph = $('#phone'), cols = ['#0566E0','#2E7BFF','#FDCC0D','#108474','#0B0D10'];
  for (let i = 0; i < 48; i++) { const c = document.createElement('i'); c.className = 'cf';
    c.style.left = (Math.random() * 100) + '%'; c.style.background = cols[i % cols.length];
    c.style.animationDelay = (Math.random() * .35) + 's'; c.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');

}
function gotoStep(i) {
  if (i < 0 || i >= TOUR.length) return;
  clearInterval(vidTimer);
  const s = TOUR[i];
  const keep = !!(s.player && PL && PL.tour && PL.pid === s.player);
  if (!keep) stopPlayer();
  TS = i;
  layers = keep ? layers.filter(l => l.type === 'player') : [];
  ui.tourPost = !!s.tourPost;
  if (s.tab) { ui.tab = s.tab; lastTab = null; }
  if (s.ctab) ui.ctab = s.ctab;
  if (s.ttab) ui.ttab = s.ttab;
  if (s.mtab) ui.mtab = s.mtab;
  if (s.ensurePlan && schedFor(todayDow()) == null) genPlan({goal:'run', level:'1', days:'4', min:'30', care:'none'});
  if (s.lay) layers = s.lay();
  if (s.player && !keep) openPlayer(s.player, true); else render();
  if (s.confetti) confetti();
  const h = document.getElementById('hand'); if (h) h.style.display = 'none';
  setTimeout(() => { applyHL(true); }, 120);
}
function tourTap(tgt) {

function countUp() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = parseFloat(el.dataset.count), t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 700); el.textContent = num(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

const GHOSTS = [{n:'Camila R.',c:'#E4572E',r:1.08},{n:'Matías G.',c:'#7B2CBF',r:0.97},{n:'Coach Nico',c:'#0B0D10',r:1.02},{n:'Sofía M.',c:'#F2A541',r:0.9}];
function openPlayer(pid, tour) {
  stopPlayer();
  const p = PLAN[pid];
  PL = { pid, i:0, left:p.steps[0].s, el:0, paused:false, speed:10, hr:84, kcal:0, km:0, pts:0, tour:!!tour,
    ghosts:GHOSTS.map(g => ({...g, pts:0})) };
  if (tour) { PL.i = 1; PL.left = p.steps[1].s; }
  layers = layers.filter(l => l.type !== 'plan');
  layers.push({type:'player'});
  render();
  plTimer = setInterval(plTick, 250);
}
function stopPlayer() { clearInterval(plTimer); plTimer = null; PL = null; layers = layers.filter(l => l.type !== 'player'); }
function plTick() {
  if (!PL || PL.paused) return;
  const p = PLAN[PL.pid], st = p.steps[PL.i], it = st.i || 2, tot = planSec(p);
  const dt = 0.25 * PL.speed;
  PL.left -= dt; PL.el += dt;
  PL.kcal += p.kcal / tot * dt * (it / 1.8);
  PL.km += (p.km || 0) / tot * dt * (it / 1.8);
  PL.pts += dt * it * (0.95 + Math.random() * 0.15);
  PL.ghosts.forEach(g => g.pts += dt * 1.9 * g.r * (0.8 + Math.random() * 0.4));
  PL.hr += ((88 + it * 26) - PL.hr) * Math.min(1, 0.06 * dt) + (Math.random() - 0.5) * 1.5;
  if (PL.left <= 0) {
    if (PL.i < p.steps.length - 1) { PL.i++; PL.left = p.steps[PL.i].s; beep(); renderLayers(); applyHL(false); }
    else if (PL.tour) { PL.i = 1; PL.left = p.steps[1].s; renderLayers(); applyHL(false); }
    else finishWorkout(true);
    return;
  }
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set('pl-time', mmss(PL.left)); set('pl-hr', Math.round(PL.hr)); set('pl-kcal', Math.round(PL.kcal));
  set('pl-km', p.km ? num(PL.km, 2) : Math.round(PL.pts)); set('pl-el', mmss(PL.el));
  const b = document.getElementById('pl-bar'); if (b) b.style.width = ((1 - PL.left / st.s) * 100) + '%';
  const bd = document.getElementById('pl-board'); if (bd) bd.innerHTML = plBoard();
}
function finishWorkout(completed) {
  if (!PL || PL.tour) return;
  const p = PLAN[PL.pid], before = stats();
  const min = Math.max(1, Math.round(PL.el / 60));
  const rank = [...PL.ghosts.map(g => g.pts), PL.pts].sort((a, b) => b - a).indexOf(PL.pts) + 1;
  const xp = Math.round((min * 10 + (completed ? 50 : 0)) * (S.plus ? 1.2 : 1));
  const w = { t:Date.now(), p:p.id, m:machineFor(p), min, kcal:Math.round(PL.kcal), km:Math.round(PL.km * 10) / 10, xp };
  S.workouts.push(w); save();
  const after = stats();
  const nb = BADGES.filter(b => b.ok(after) && !b.ok(before));
  stopPlayer();
  layers.push({type:'summary', w, rank, nb});
  beep(); render(); confetti();
}
function canStart(pid) {
  const p = PLAN[pid];
  if (planLocked(p)) { openPaywall(L(p.name)); return false; }
  if (!S.plus && stats().week >= FREE_WEEK) { openPaywall(tt('Unlimited guided workouts','Entrenos guiados ilimitados')); return false; }
  return true;
}
function openPaywall(ctx) { layers = layers.filter(l => !SHEETS.includes(l.type)); layers.push({type:'plus', ctx}); render(); }

function playVideo(i) {
  S.learned = true; save();
  const top = layers.find(l => l.type === 'machine');
  const l = {type:'video', mid:top.id, i, step:0, p:0};
  layers.push(l); render();

    const bars = document.querySelectorAll('.vid .prog b'); if (bars[l.step]) bars[l.step].style.width = l.p + '%';
  }, 100);

  cmt(v) { ui.open[v] = !ui.open[v]; render(); },
  cmtAdd(v) { const i = document.getElementById('cin-' + v); const t = i && i.value.trim(); if (!t) return; (S.comments[v] = S.comments[v] || []).push(t); save(); render(); },
  post() { const i = $('#postIn'); const t = i && i.value.trim(); if (!t) return; S.posts.unshift({id:'u' + Date.now(), txt:t, k:0}); save(); render(); toast(tt('Posted to the community','Publicado en la comunidad')); },
  remind(v) { S.reminders[v] = !S.reminders[v]; save(); render(); if (S.reminders[v]) toast('🔔 ' + tt("You're in! We'll remind you 15 min before.",'¡Listo! Te avisaremos 15 min antes.')); },
  copy(v) { try { navigator.clipboard.writeText(v); } catch (e) {} toast(tt('Copied: ','Copiado: ') + v); },
  saveName() { S.name = $('#nameIn').value.trim().slice(0, 24); save(); render(); toast('✓ ' + tt('Saved','Guardado')); },
  goal(v) { S.goal = Math.max(1, Math.min(7, S.goal + +v)); save(); render(); },
  reset() { if (confirm(tt('Reset all demo data?','¿Reiniciar todos los datos de la demo?'))) { const l = S.lang; S = seed(); S.lang = l; S.onboarded = true; save(); layers = []; ui.tab = 'home'; render(); toast(tt('Demo reset','Demo reiniciada')); } },
  restartOb() { ui.ob = 0; ui.obGear = [...S.gear]; layers = [{type:'ob'}]; render(); },
  paywall(v) { openPaywall(v || ''); },
  bill(v) { ui.bill = v; renderLayers(); applyHL(false); },
  plusStart() { S.plus = true; S.plusUntil = Date.now() + 7 * D; save(); layers = layers.filter(l => l.type !== 'plus'); render(); toast('⭐ ' + tt('MARTOM+ active – 7 days free!','¡MARTOM+ activo: 7 días gratis!')); confetti(); },
  plusCancel() { if (confirm(tt('Cancel MARTOM+ (demo)?','¿Cancelar MARTOM+ (demo)?'))) { S.plus = false; save(); render(); } },
  plPause() { PL.paused = !PL.paused; renderLayers(); applyHL(false); },
  plSkip() { const p = PLAN[PL.pid]; PL.el += Math.max(0, PL.left); PL.left = 0; if (PL.i >= p.steps.length - 1) { finishWorkout(true); return; } PL.i++; PL.left = p.steps[PL.i].s; renderLayers(); applyHL(false); },
  plSpeed() { PL.speed = PL.speed === 1 ? 10 : PL.speed === 10 ? 30 : 1; renderLayers(); applyHL(false); },
  plEnd() {
    if (PL.tour) { stopPlayer(); render(); return; }
    if (PL.el >= 60) { PL.paused = true; if (confirm(tt('End workout and save your progress?','¿Terminar y guardar tu progreso?'))) finishWorkout(false); else { PL.paused = false; } }
    else { stopPlayer(); render(); }
  },
  rate(v) { const l = layers[layers.length - 1]; l.rate = +v; S.ratings.push({t:Date.now(), p:l.w.p, r:+v}); save(); renderLayers(); },
  share() { const l = layers[layers.length - 1], w = l.w, p = PLAN[w.p];
    S.posts.unshift({id:'u' + w.t, txt:tt(`Just finished "${L(p.name)}" 💪`, `Terminé "${L(p.name)}" 💪`), w:{p:w.p, min:w.min, kcal:w.kcal}, k:0});
    S.shared[w.t] = true; save(); renderLayers(); toast(tt('Shared with the community 🎉','Compartido con la comunidad 🎉')); },
  obNext() { ui.ob++; renderLayers(); },
  obBack() { ui.ob = Math.max(0, ui.ob - 1); renderLayers(); },
  obSkip() { S.onboarded = true; save(); layers = []; render(); },
  obGear(v) { const g = ui.obGear; const i = g.indexOf(v); i >= 0 ? g.splice(i, 1) : g.push(v); renderLayers(); },
  obGoal(v) { const n = document.getElementById('obName'); if (n) S.name = n.value.trim().slice(0, 24); S.goalType = v; renderLayers(); },
  obDone() { const n = document.getElementById('obName'); if (n) S.name = n.value.trim().slice(0, 24);
    S.gear = [...ui.obGear]; S.prog = {strong:'strength', run:'run', lose:'low', fit:'balanced'}[S.goalType];
    if (!S.plus && !PROGRAMS.find(p => p.id === S.prog).free) S.prog = 'balanced';
    S.progStart = weekStart(); S.sched = {}; S.onboarded = true; save(); layers = []; ui.tab = 'home'; render();
    toast(tt('Your personal plan is ready','Tu plan personal está listo') + (S.name ? ', ' + S.name : '') + '! 💪'); },
};

document.addEventListener('click', e => {
  if (TS != null && e.target.closest('#phone') && !e.target.closest('.tour-card')) {
    e.preventDefault(); e.stopPropagation();
    const s = TOUR[TS], tgt = s.tap && document.querySelector(s.tap);
    if (tgt && tgt.contains(e.target)) tourTap(tgt);
    else { const h = document.getElementById('hand'); if (h) { h.classList.remove('nudge'); void h.offsetWidth; h.classList.add('nudge'); } }
    return;
  }
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled || el.tagName === 'A') return;
  const fn = A[el.dataset.a];
  if (fn) fn(el.dataset.v, el, e);
}, true);
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'postIn') A.post();
  else if (e.target.id && e.target.id.startsWith('cin-')) A.cmtAdd(e.target.id.slice(4));
  else if (e.target.id === 'nameIn') A.saveName();
});
window.addEventListener('resize', () => renderTour());

/* ---------- Boot: interactive demo on every page load (skip with #app) ---------- */
ui.obGear = [...S.gear];
requestAnimationFrame(animFigs);
setInterval(() => { if (TS != null) placeHand(); }, 120);
if (location.hash === '#app') { if (!S.onboarded) layers.push({type:'ob'}); render(); }
else { render(); setTimeout(() => gotoStep(0), 250); }
</script>
</body>
</html>
